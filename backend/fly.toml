# Fly.io configuration for AI Builder backend.
# Run: fly launch --copy-config --no-deploy && fly secrets set ANTHROPIC_API_KEY=... JWT_SECRET=... && fly deploy

app = "ai-builder-backend"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/ai_builder.db"
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "ai_builder_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
